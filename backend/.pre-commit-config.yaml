repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-extraction-schema
        name: Check extraction_schema.json is up to date
        entry: uv run --directory backend python scripts/check_extraction_schema.py
        language: system
        files: (schemas\.py|extraction_schema\.json)$
        pass_filenames: false
